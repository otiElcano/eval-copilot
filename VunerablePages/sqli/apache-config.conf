<VirtualHost *:80>
    ServerName sqli-demo.local
    DocumentRoot /home/kali/Desktop/Vulnerabilities/sqli
    DirectoryIndex index.php
    
    <Directory /home/kali/Desktop/Vulnerabilities/sqli>
        AllowOverride All
        Require all granted
        Options Indexes FollowSymLinks
    </Directory>
    
    # Logs
    ErrorLog ${APACHE_LOG_DIR}/sqli-demo_error.log
    CustomLog ${APACHE_LOG_DIR}/sqli-demo_access.log combined
</VirtualHost>